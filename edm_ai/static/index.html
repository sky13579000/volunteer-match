<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICC JEJU 문서·AI 플랫폼</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="card login-card">
    <h1>ICC JEJU</h1>
    <p class="hint">제주국제컨벤션센터 문서·AI 플랫폼 <span id="login-ver"></span></p>
    <div id="login-demo" hidden>
      <label>데모 사용자 <select id="demo-user"></select></label>
      <p class="hint">데모 전용 화면입니다. 운영에서는 토큰/SSO 모드를 사용하세요.</p>
    </div>
    <div id="login-token" hidden>
      <label>액세스 토큰 <input id="token" type="password" autocomplete="off" placeholder="edm-ai token -u 사용자 로 발급"></label>
    </div>
    <button id="login-go" class="primary">시작</button>
    <p id="login-err" class="err" role="alert"></p>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <aside class="side" aria-label="주 메뉴">
    <div class="brand">ICC JEJU<small>문서·AI 플랫폼</small></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span id="who"></span><span id="ver" class="hint"></span><button id="logout" class="link">로그아웃</button></div>
  </aside>
  <div class="main-col">
    <header class="top">
      <form id="top-search" role="search" class="top-search">
        <input id="top-q" type="search" placeholder="문서 검색 (제목 · 문서번호 · 내용 · 태그)" aria-label="문서 검색">
      </form>
      <button id="bell" class="bell" aria-label="알림">알림<span id="bell-n" class="count" hidden></span></button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="/main.js"></script>
</body>
</html>
