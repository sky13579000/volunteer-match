[project]
name = "edm-ai"
version = "0.1.0"
description = "EDM-to-AI knowledge platform: permission-aware, evidence-grounded retrieval over documents and structured DBs (on-prem / air-gapped friendly, zero dependencies)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
edm-ai = "edm_ai.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
oracle = ["oracledb>=2.0"]
pdf = ["pypdf>=4.0"]

[tool.setuptools]
packages = ["edm_ai"]

[tool.setuptools.package-data]
edm_ai = ["static/*"]
